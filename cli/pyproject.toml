[project]
name = "hypercluster"
version = "1.0.0"
description = "Hypercluster — end-to-end Kubernetes cluster lifecycle CLI"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1.0",
    "pydantic>=2.0.0",
    "paramiko>=3.4.0",
    "pyyaml>=6.0.0",
    "platformdirs>=4.0",
]

[project.scripts]
hypercluster = "hypercluster.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pyinstaller>=6.0"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["hypercluster*"]

[tool.setuptools.package-data]
"hypercluster" = ["config/**/*", "py.typed"]
