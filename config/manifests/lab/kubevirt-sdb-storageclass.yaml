# Reference StorageClass for KubeVirt VM disks on a secondary host volume.
# Prefer: hypercluster lab storage (creates class from LAB_KUBEVIRT_STORAGE_CLASS in cluster.conf).
#
# Use on DataVolumes / PVCs:
#   storageClassName: kubevirt-sdb
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: kubevirt-sdb
  annotations:
    storageclass.kubernetes.io/description: "KubeVirt VM disks on secondary volume (/data/kubevirt-volumes)"
provisioner: rancher.io/local-path
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer
