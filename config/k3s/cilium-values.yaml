# KubeVirt-aware Cilium for k3s (Flannel disabled). Generated/overridden at deploy time.
kubeProxyReplacement: true

k8sServiceHost: K8S_SERVICE_HOST
k8sServicePort: 6443

operator:
  replicas: 1

ipam:
  mode: kubernetes

hubble:
  enabled: true
  relay:
    enabled: true
  ui:
    enabled: true

gatewayAPI:
  enabled: true

l2announcements:
  enabled: true

externalIPs:
  enabled: true

nodePort:
  enabled: true

bgpControlPlane:
  enabled: true

bandwidthManager:
  enabled: true

localRedirectPolicy: true

socketLB:
  enabled: true

hostFirewall:
  enabled: false

encryption:
  enabled: false

k8sClientRateLimit:
  qps: 50
  burst: 200

bpf:
  masquerade: true

routingMode: native
autoDirectNodeRoutes: true
ipv4NativeRoutingCIDR: POD_CIDR

kubevirt:
  enabled: true
