# KubeVirt-aware Cilium for k3s (Flannel disabled). Generated/overridden at deploy time.
kubeProxyReplacement: KUBE_PROXY_REPLACEMENT

k8sServiceHost: K8S_SERVICE_HOST
k8sServicePort: 6443

operator:
  replicas: 1

ipam:
  mode: kubernetes

hubble:
  enabled: HUBBLE_ENABLED
  relay:
    enabled: HUBBLE_ENABLED
  ui:
    enabled: HUBBLE_ENABLED

gatewayAPI:
  enabled: GATEWAY_API_ENABLED

l2announcements:
  enabled: true

externalIPs:
  enabled: true

nodePort:
  enabled: true

bgpControlPlane:
  enabled: BGP_CONTROL_PLANE_ENABLED

bandwidthManager:
  enabled: true

localRedirectPolicy: true

socketLB:
  enabled: true

hostFirewall:
  enabled: false

encryption:
  enabled: ENCRYPTION_ENABLED

k8sClientRateLimit:
  qps: 50
  burst: 200

bpf:
  masquerade: true
  # k3s API server runs on the host; without kube-proxy it needs BPF LB for ClusterIP.
  lbExternalClusterIP: true

routingMode: native
autoDirectNodeRoutes: true
ipv4NativeRoutingCIDR: POD_CIDR

kubevirt:
  enabled: true
